user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id=$upstream_http_x_request_id';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # The exact nginx version tells an anonymous caller which published
    # vulnerabilities are worth trying. This drops it from the Server header and
    # from the footer of nginx's own error pages. The bare word "nginx" stays in
    # the header: removing it needs a build with the headers-more module, and
    # this image is stock nginx:alpine on purpose.
    server_tokens off;

    # Security headers.
    #
    # NOTE: nginx does NOT merge add_header across levels. A block that
    # declares any add_header of its own discards every header inherited from
    # its parent, so a location that adds even one header must repeat this
    # whole set. Keeping the list in a single place is deliberate — the
    # /hls/ and /webrtc/ proxies that used to duplicate it are gone.
    #
    # Strict-Transport-Security has no effect on this server: it listens on
    # :80 only and browsers ignore HSTS over plain HTTP. It is kept for parity
    # with the production config, where Ansible renders an HTTPS server from
    # ansible/roles/ssl_cert/templates/nginx-ssl.conf.j2 and the header does
    # take effect.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 11M;
        client_body_timeout 30s;
        client_header_timeout 10s;

        # nginx signs the pages it generates itself (404 from the /.env deny
        # below, 413 over client_max_body_size, 502/504 when app is down).
        # Errors the application returns are untouched: proxy_intercept_errors
        # is off by default, so its JSON bodies pass through as they are.
        error_page 400 401 403 404 405 408 413 414 429 500 502 503 504 /error.html;

        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        location /.env {
            deny all;
            return 404;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://app:8000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        location /auth/ {
            proxy_pass http://app:8000/auth/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        location /health {
            proxy_pass http://app:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
