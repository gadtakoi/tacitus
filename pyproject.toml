[project]
name = "tacitus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pre-commit>=4.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "ansible-core>=2.21.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.10.0",
    "cyclonedx-bom>=4.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "jose.*", "passlib.*", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
