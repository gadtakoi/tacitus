services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacitus-app:0.1.0
    container_name: tacitus-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TACITUS_APP_NAME=${TACITUS_APP_NAME:-tacitus}
      - TACITUS_DEBUG=${TACITUS_DEBUG:-false}
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27.5-alpine
    container_name: tacitus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tacitus-network

networks:
  tacitus-network:
    driver: bridge
