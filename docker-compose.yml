services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacitus-app:0.1.0
    container_name: tacitus-app
    restart: unless-stopped
    read_only: true
    env_file:
      - .env
    environment:
      - TACITUS_APP_NAME=${TACITUS_APP_NAME:-tacitus}
      - TACITUS_DEBUG=${TACITUS_DEBUG:-false}
      - TACITUS_ENVIRONMENT=${TACITUS_ENVIRONMENT:-development}
      - TACITUS_DATABASE_URL=${TACITUS_DATABASE_URL:-postgresql+asyncpg://tacitus:tacitus@postgres:5432/tacitus}
      - TACITUS_RATE_LIMIT_STORAGE_URI=${TACITUS_RATE_LIMIT_STORAGE_URI:-redis://redis:6379}
      - TACITUS_S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - TACITUS_S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - TACITUS_S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - TACITUS_S3_BUCKET=${S3_BUCKET:-tacitus-files}
      - TACITUS_JWT_SECRET=${TACITUS_JWT_SECRET:-change-me-in-production}
      - TACITUS_MTX_API_URL=${TACITUS_MTX_API_URL:-http://mediamtx:9997/v3}
      - TACITUS_MTX_API_USER=${TACITUS_MTX_API_USER:-tacitus-api}
      - TACITUS_MTX_API_PASSWORD=${TACITUS_MTX_API_PASSWORD:-dev-api-change-me}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - tacitus-network
    tmpfs:
      - /tmp
    volumes:
      - app-logs:/var/log/tacitus
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tacitus-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tacitus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-tacitus-files}
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      do i=$$((i+1)); [ $$i -ge 30 ] && exit 1; echo 'minio недоступен, повтор через 2с'; sleep 2; done;
      mc mb local/$${S3_BUCKET} --ignore-existing
      "
    networks:
      - tacitus-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: tacitus-nginx:0.1.0
    container_name: tacitus-nginx
    restart: unless-stopped
    read_only: true
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - nginx-run:/run
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tacitus-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  mediamtx:
    image: bluenviron/mediamtx:1.15.1-ffmpeg
    container_name: tacitus-mediamtx
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - MTX_RTSPADDRESS=:${TACITUS_MTX_RTSP_PORT:-8554}
      - MTX_RTSPTRANSPORTS=${TACITUS_MTX_RTSP_TRANSPORTS:-tcp}
    ports:
      # Bound to loopback by default: RTSP carries Basic credentials in the
      # clear (rtspEncryption is off), so the port should only be reachable by
      # hosts the operator has deliberately allowed. Set
      # TACITUS_MTX_RTSP_BIND=0.0.0.0 — together with a firewall rule — to let
      # cameras on the network publish.
      - "${TACITUS_MTX_RTSP_BIND:-127.0.0.1}:${TACITUS_MTX_RTSP_PORT:-8554}:${TACITUS_MTX_RTSP_PORT:-8554}"
    volumes:
      - ./recordings:/recordings
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${TACITUS_MTX_RTSP_PORT:-8554}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  mediamtx-cleanup:
    # Runs on the application image, which already carries boto3 from the
    # build. Previously this was a bare python:3.14-slim that ran
    # `pip install boto3` on every start: the archive manager deletes local
    # recordings after uploading them, and it could not start at all without
    # reaching PyPI. Sharing the image means one place pins the SDK and the
    # cleanup job talks to S3 through exactly the same boto3 as the app.
    build:
      context: .
      dockerfile: Dockerfile
    image: tacitus-app:0.1.0
    container_name: tacitus-mediamtx-cleanup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RECORDINGS_PATH=/recordings
      - MAX_AGE_DAYS=${TACITUS_MTX_MAX_AGE_DAYS:-7}
      - MAX_SIZE_GB=${TACITUS_MTX_MAX_SIZE_GB:-50}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-tacitus-files}
      - S3_PREFIX=mediamtx-archives/
    volumes:
      - ./recordings:/recordings
      - ./scripts/mediamtx-archive-manager.py:/app/script.py:ro
    networks:
      - tacitus-network
    # The application image declares a HEALTHCHECK that probes the HTTP API on
    # port 8000. This container runs the archive loop instead of uvicorn, so
    # that probe can only ever fail and would park the service in `unhealthy`.
    healthcheck:
      disable: true
    command: >
      sh -c "while true; do
               python /app/script.py;
               sleep 3600;
             done"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  postgres:
    # Точный патч-тег, а не `18-alpine`: плавающий тег молча подменял версию
    # СУБД при `docker compose pull`, то есть окружение переставало быть
    # воспроизводимым. Обновление версии — осознанное изменение этой строки.
    image: postgres:18.6-alpine
    container_name: tacitus-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tacitus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tacitus}
      - POSTGRES_DB=${POSTGRES_DB:-tacitus}
    ports:
      # Привязано к loopback: порт нужен только тестам с хоста
      # (`conftest.py` ходит на localhost:15432), а публикация на все
      # интерфейсы выставляла БД в сеть. Задайте TACITUS_POSTGRES_BIND=0.0.0.0,
      # если нужен доступ извне — вместе с правилом firewall.
      #
      # Публикуется на обоих loopback-адресах намеренно. Windows резолвит
      # `localhost` сначала в ::1, и при публикации только на 127.0.0.1 каждое
      # подключение ждало ~2 с таймаута IPv6 перед откатом на IPv4. Фикстуры
      # тестов используют NullPool, то есть открывают соединение на тест, —
      # прогон замедлялся почти в десять раз.
      - "${TACITUS_POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-15432}:5432"
      - "[::1]:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # Не `/var/lib/postgresql/data`: начиная с 18 образ хранит данные в
      # каталоге с номером мажорной версии (/var/lib/postgresql/18/docker) и
      # отказывается стартовать, увидев том на старом пути. Смена этой строки
      # на образе ≤17 требует пересоздания тома — данные лежат по другому пути.
      - postgres-data:/var/lib/postgresql
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacitus-app:0.1.0
    container_name: tacitus-db-migrations
    env_file:
      - .env
    environment:
      - TACITUS_DATABASE_URL=${TACITUS_DATABASE_URL:-postgresql+asyncpg://tacitus:tacitus@postgres:5432/tacitus}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tacitus-network
    working_dir: /app
    command: >
      sh -c "python -m alembic -c /app/alembic.ini upgrade head"

  redis:
    image: redis:7.4.10-alpine
    container_name: tacitus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  minio-data:
  letsencrypt:
  nginx-cache:
  nginx-logs:
  nginx-run:
  app-logs:
  postgres-data:
  redis-data:

networks:
  tacitus-network:
    driver: bridge
