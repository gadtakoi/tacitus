services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tacitus-app:0.1.0
    container_name: tacitus-app
    restart: unless-stopped
    read_only: true
    env_file:
      - .env
    environment:
      - TACITUS_APP_NAME=${TACITUS_APP_NAME:-tacitus}
      - TACITUS_DEBUG=${TACITUS_DEBUG:-false}
      - TACITUS_ENVIRONMENT=${TACITUS_ENVIRONMENT:-development}
      - TACITUS_S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - TACITUS_S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - TACITUS_S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - TACITUS_S3_BUCKET=${S3_BUCKET:-tacitus-files}
      - TACITUS_JWT_SECRET=${TACITUS_JWT_SECRET:-change-me-in-production}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - tacitus-network
    tmpfs:
      - /tmp
    volumes:
      - app-logs:/var/log/tacitus
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tacitus-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tacitus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-tacitus-files}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb local/$${S3_BUCKET} --ignore-existing
      "
    networks:
      - tacitus-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: tacitus-nginx:0.1.0
    container_name: tacitus-nginx
    restart: unless-stopped
    read_only: true
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - nginx-run:/run
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tacitus-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  mediamtx:
    image: bluenviron/mediamtx:1.15.1-ffmpeg
    container_name: tacitus-mediamtx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MTX_RTSPADDRESS=:${TACITUS_MTX_RTSP_PORT:-8554}
      - MTX_RTMPADDRESS=:${TACITUS_MTX_RTMP_PORT:-1935}
      - MTX_HLSADDRESS=:${TACITUS_MTX_HLS_PORT:-8888}
      - MTX_WEBRTCADDRESS=:${TACITUS_MTX_WEBRTC_PORT:-8889}
      - MTX_SRTADDRESS=:${TACITUS_MTX_SRT_PORT:-8890}
      - MTX_RTSPTRANSPORTS=${TACITUS_MTX_RTSP_TRANSPORTS:-tcp}
      - MTX_WEBRTCADDITIONALHOSTS=${TACITUS_MTX_WEBRTC_ADDITIONAL_HOSTS:-}
    ports:
      - "${TACITUS_MTX_RTSP_PORT:-8554}:${TACITUS_MTX_RTSP_PORT:-8554}"
      - "${TACITUS_MTX_RTMP_PORT:-1935}:${TACITUS_MTX_RTMP_PORT:-1935}"
      - "${TACITUS_MTX_HLS_PORT:-8888}:${TACITUS_MTX_HLS_PORT:-8888}"
      - "${TACITUS_MTX_WEBRTC_PORT:-8889}:${TACITUS_MTX_WEBRTC_PORT:-8889}"
      - "${TACITUS_MTX_SRT_PORT:-8890}:${TACITUS_MTX_SRT_PORT:-8890}"
      - "${TACITUS_MTX_ICE_PORT:-8189}:${TACITUS_MTX_ICE_PORT:-8189}/udp"
    volumes:
      - mediamtx-recordings:/recordings
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - tacitus-network
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/${TACITUS_MTX_RTSP_PORT:-8554}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  minio-data:
  letsencrypt:
  nginx-cache:
  nginx-logs:
  nginx-run:
  app-logs:
  mediamtx-recordings:

networks:
  tacitus-network:
    driver: bridge
