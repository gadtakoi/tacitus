all:
  children:
    tacitus:
      hosts:
        tacitus-server:
          ansible_host: "{{ target_host | default('localhost') }}"
          ansible_user: "{{ deploy_user | default('ansible') }}"
          # `default(omit)` does not omit inside inventory vars — it renders to a
          # placeholder string, which reaches ssh as a bogus password and makes
          # ansible.posix.synchronize demand sshpass even for a local run.
          # An empty string is falsy, so key auth and local runs both work.
          ansible_ssh_pass: "{{ deploy_password | default('', true) }}"
          ansible_connection: "{{ connection_type | default('ssh') }}"
          # Optional: override MediaMTX paths per host
          # mediamtx_paths:
          #   - name: front_door
          #     source: publisher
          #   - name: backyard
          #     source: publisher
