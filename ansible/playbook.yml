---
- name: Deploy Tacitus Hello World
  hosts: tacitus
  gather_facts: true

  pre_tasks:
    - name: Pre-check | Verify target host connectivity
      ansible.builtin.ping:

  roles:
    - role: docker_install
      tags: [docker, install]

    - role: ssl_cert
      tags: [ssl, cert]
      when: tacitus_enable_https | bool

    - role: app_deploy
      tags: [app, deploy]

  post_tasks:
    - name: Post-check | Verify HTTP application responds
      ansible.builtin.uri:
        url: "{{ app_hello_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: hello_response
      retries: 5
      delay: 3
      until: hello_response.status == 200
      when: not tacitus_enable_https | bool

    - name: Post-check | Assert response contains Hello World (HTTP)
      ansible.builtin.assert:
        that:
          - "'Hello World' in hello_response.content"
        fail_msg: "Application did not return expected Hello World message"
        success_msg: "Application is running and returning Hello World"
      when: not tacitus_enable_https | bool

    - name: Post-check | Verify HTTPS redirect (HTTP → HTTPS)
      ansible.builtin.uri:
        url: "http://{{ tacitus_domain }}/"
        method: GET
        status_code: 301
        follow_redirects: none
      when: tacitus_enable_https | bool

    - name: Post-check | Verify HTTPS application responds
      ansible.builtin.uri:
        url: "https://{{ tacitus_domain }}/"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: "{{ not ssl_certbot_staging }}"
      register: https_response
      retries: 5
      delay: 3
      until: https_response.status == 200
      when: tacitus_enable_https | bool

    - name: Post-check | Assert response contains Hello World (HTTPS)
      ansible.builtin.assert:
        that:
          - "'Hello World' in https_response.content"
        fail_msg: "Application did not return expected Hello World message over HTTPS"
        success_msg: "Application is running over HTTPS and returning Hello World"
      when: tacitus_enable_https | bool

    - name: Post-check | Verify all containers are healthy
      ansible.builtin.command:
        cmd: "docker compose ps --format json"
        chdir: "{{ tacitus_deploy_dir }}"
      register: container_status
      changed_when: false

    - name: Post-check | Display deployment status
      ansible.builtin.debug:
        msg: "Tacitus deployed successfully. Response: {{ hello_response.content }}"
