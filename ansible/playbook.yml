---
- name: Deploy Tacitus Hello World
  hosts: tacitus
  gather_facts: true

  pre_tasks:
    - name: Pre-check | Verify target host connectivity
      ansible.builtin.ping:

    # The app refuses to start in production with default secrets. Catching it
    # here turns a container crash-loop on the server into an actionable error
    # before anything is copied.
    - name: Pre-check | Refuse to deploy production with default secrets
      ansible.builtin.assert:
        that:
          - tacitus_jwt_secret != 'change-me-in-production'
          - tacitus_jwt_secret | length >= 32
          - tacitus_s3_access_key != 'minioadmin'
          - tacitus_s3_secret_key != 'minioadmin'
          - tacitus_postgres_password != 'change-me-in-production'
          - "'*' not in tacitus_cors_origins"
          - mediamtx_publish_password != 'dev-publisher-change-me'
          - mediamtx_read_password != 'dev-reader-change-me'
          - mediamtx_api_password != 'dev-api-change-me'
        fail_msg: >-
          Refusing to deploy with tacitus_environment=production and default
          secrets. Pass them explicitly, e.g.:
          -e tacitus_jwt_secret="$(openssl rand -hex 32)"
          -e tacitus_s3_access_key="$(openssl rand -hex 16)"
          -e tacitus_s3_secret_key="$(openssl rand -hex 32)"
          -e tacitus_postgres_password="$(openssl rand -hex 24)"
          -e mediamtx_publish_password="$(openssl rand -hex 24)"
          -e mediamtx_read_password="$(openssl rand -hex 24)"
          -e mediamtx_api_password="$(openssl rand -hex 24)"
          (JWT secret must be at least 32 characters. MediaMTX credentials
          protect RTSP publish/read and the Control API — with the defaults
          anyone reaching the RTSP port can push and pull streams.)
        success_msg: "Production secrets have been overridden"
      when: tacitus_environment == 'production'

  roles:
    - role: docker_install
      tags: [docker, install]

    - role: ssl_cert
      tags: [ssl, cert]
      when: tacitus_enable_https | bool

    - role: app_deploy
      tags: [app, deploy]

    - role: mediamtx
      tags: [mediamtx]

  post_tasks:
    - name: Post-check | Verify HTTP application responds
      ansible.builtin.uri:
        url: "{{ app_hello_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: hello_response
      retries: 5
      delay: 3
      until: hello_response.status == 200
      when: not tacitus_enable_https | bool

    - name: Post-check | Assert response contains Hello World (HTTP)
      ansible.builtin.assert:
        that:
          - "'Hello World' in hello_response.content"
        fail_msg: "Application did not return expected Hello World message"
        success_msg: "Application is running and returning Hello World"
      when: not tacitus_enable_https | bool

    - name: Post-check | Verify HTTPS redirect (HTTP → HTTPS)
      ansible.builtin.uri:
        url: "http://{{ tacitus_domain }}/"
        method: GET
        status_code: 301
        follow_redirects: none
      when: tacitus_enable_https | bool

    - name: Post-check | Verify HTTPS application responds
      ansible.builtin.uri:
        url: "https://{{ tacitus_domain }}/"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: "{{ not ssl_certbot_staging }}"
      register: https_response
      retries: 5
      delay: 3
      until: https_response.status == 200
      when: tacitus_enable_https | bool

    - name: Post-check | Assert response contains Hello World (HTTPS)
      ansible.builtin.assert:
        that:
          - "'Hello World' in https_response.content"
        fail_msg: "Application did not return expected Hello World message over HTTPS"
        success_msg: "Application is running over HTTPS and returning Hello World"
      when: tacitus_enable_https | bool

    - name: Post-check | Verify all containers are healthy
      ansible.builtin.command:
        cmd: "docker compose ps --format json"
        chdir: "{{ tacitus_deploy_dir }}"
      register: container_status
      changed_when: false

    - name: Post-check | Display deployment status
      ansible.builtin.debug:
        msg: "Tacitus deployed successfully. Response: {{ hello_response.content }}"
