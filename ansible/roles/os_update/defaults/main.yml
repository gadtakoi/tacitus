---
# Тип обновления, значение передаётся в ansible.builtin.apt:
#   safe — только то, что не требует удаления установленных пакетов
#          (apt-get upgrade). Безопасный вариант по умолчанию;
#   full — apt-get dist-upgrade, разрешает удаление пакетов ради разрешения
#          зависимостей. Нужен, например, для смены версии ядра;
#   dist — синоним full, оставлен для совместимости с привычной командой.
os_update_upgrade: "safe"

# Не перечитывать список пакетов, если он обновлялся меньше часа назад:
# повторный запуск плейбука не должен каждый раз ходить в зеркала.
os_update_cache_valid_time: 3600

# Убрать пакеты, оставшиеся без зависимых (apt-get autoremove).
os_update_autoremove: true

# Очистить кеш скачанных .deb (apt-get autoclean). На маленьком диске это
# единственное, что отделяет /var от заполнения.
os_update_autoclean: true

# Перезагружать хост, если обновление этого требует (ядро, libc).
# Выключено намеренно: на хосте PostgreSQL и, возможно, идущая запись RTSP,
# и незапланированный ребут — худший исход, чем отложенное обновление ядра.
# При false роль только сообщает, что перезагрузка нужна, и оставляет момент
# на усмотрение оператора.
os_update_reboot: false

# Сколько ждать возвращения хоста после перезагрузки, секунд.
os_update_reboot_timeout: 600
