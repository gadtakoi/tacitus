---
# Kept separate from main.yml so app_deploy can render the config *before* it
# runs `docker compose up`. Without that, compose starts mediamtx while
# mediamtx.yml is still missing and Docker creates a directory in its place,
# after which every later run dies on "not a directory".
- name: Ensure MediaMTX configuration directory exists
  ansible.builtin.file:
    path: "{{ tacitus_deploy_dir }}/mediamtx"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure MediaMTX recordings directory exists
  ansible.builtin.file:
    path: "{{ tacitus_deploy_dir }}/recordings"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Render MediaMTX configuration
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: "{{ tacitus_deploy_dir }}/mediamtx/mediamtx.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart MediaMTX
