---
# Application settings
tacitus_app_name: "tacitus"
tacitus_version: "0.1.0"
tacitus_deploy_dir: "/opt/tacitus"
tacitus_debug: "false"

# Nginx settings
nginx_host_port: 80
nginx_https_port: 443

# SSL / Domain settings
tacitus_domain: ""
tacitus_enable_https: false
tacitus_email: "admin@example.com"

# Docker settings
docker_user: "{{ ansible_user }}"

# Pre/post check settings
app_health_url: "http://localhost:{{ nginx_host_port }}/health"
app_hello_url: "http://localhost:{{ nginx_host_port }}/"
