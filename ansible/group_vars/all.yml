---
# Application settings
tacitus_app_name: "tacitus"
tacitus_version: "0.1.0"
tacitus_deploy_dir: "/opt/tacitus"
tacitus_debug: "false"

# Nginx settings
nginx_host_port: 80
nginx_https_port: 443

# SSL / Domain settings
tacitus_domain: ""
tacitus_enable_https: false
tacitus_email: "admin@example.com"

# Runtime environment. "production" makes the app enforce its startup checks
# (JWT secret length, non-default S3 credentials, no wildcard CORS), so a
# misconfigured deploy fails fast instead of running with dev defaults.
tacitus_environment: "production"

# Origins allowed by CORS. Defaults to the deployed site itself, because the
# production startup check rejects a wildcard.
tacitus_cors_origins: >-
  {{ ('https://' ~ tacitus_domain) if (tacitus_enable_https and tacitus_domain)
     else (('http://' ~ tacitus_domain) if tacitus_domain
     else ('http://' ~ target_host)) }}

# Reverse proxies in front of the app (the bundled nginx). Controls which
# X-Forwarded-For entry is trusted as the client IP.
tacitus_trusted_proxy_hops: 1

# Secrets (override via -e for production)
tacitus_jwt_secret: "change-me-in-production"
tacitus_s3_access_key: "minioadmin"
tacitus_s3_secret_key: "minioadmin"

# S3/MinIO endpoint and bucket shared by the app, MinIO itself and the
# archive-cleanup container.
tacitus_s3_endpoint: "http://minio:9000"
tacitus_s3_bucket: "tacitus-files"

# PostgreSQL credentials. The database URL is derived from them so the app and
# the postgres container can never drift apart.
tacitus_postgres_user: "tacitus"
tacitus_postgres_password: "change-me-in-production"
tacitus_postgres_db: "tacitus"

# Rate-limit counters must be shared across instances in production.
tacitus_rate_limit_storage_uri: "redis://redis:6379"

# Docker settings
docker_user: "{{ ansible_user }}"

# Host hardening. On by default (secure-by-default), toggle off per-host if
# a cloud provider's security groups already gate inbound traffic and a
# second, host-level firewall would just be one more thing to keep in sync,
# or if the host has its own unattended-upgrades policy already.
firewall_enabled: true
unattended_upgrades_enabled: true

# MediaMTX settings
mediamtx_rtsp_port: 8554
mediamtx_rtmp_port: 1935
mediamtx_hls_port: 8888
mediamtx_webrtc_port: 8889
mediamtx_srt_port: 8890
mediamtx_ice_port: 8189
mediamtx_rtsp_transports: tcp
mediamtx_webrtc_additional_hosts: ""
mediamtx_api_url: "http://mediamtx:9997/v3"

mediamtx_max_age_days: 7
mediamtx_max_size_gb: 50

mediamtx_paths:
  - name: cam1
    source: publisher

# Pre/post check settings
app_health_url: "http://localhost:{{ nginx_host_port }}/health"
