---
# Application settings
tacitus_app_name: "tacitus"
tacitus_version: "0.1.0"
tacitus_deploy_dir: "/opt/tacitus"
tacitus_debug: "false"

# Nginx settings
nginx_host_port: 80
nginx_https_port: 443

# SSL / Domain settings
tacitus_domain: ""
tacitus_enable_https: false
tacitus_email: "admin@example.com"

# Secrets (override via -e for production)
tacitus_jwt_secret: "change-me-in-production"
tacitus_s3_access_key: "minioadmin"
tacitus_s3_secret_key: "minioadmin"

# Docker settings
docker_user: "{{ ansible_user }}"

# MediaMTX settings
mediamtx_rtsp_port: 8554
mediamtx_rtmp_port: 1935
mediamtx_hls_port: 8888
mediamtx_webrtc_port: 8889
mediamtx_srt_port: 8890
mediamtx_ice_port: 8189
mediamtx_rtsp_transports: tcp
mediamtx_webrtc_additional_hosts: ""
mediamtx_api_url: "http://mediamtx:9997/v3"

mediamtx_max_age_days: 7
mediamtx_max_size_gb: 50

mediamtx_paths:
  - name: cam1
    source: publisher

# Pre/post check settings
app_health_url: "http://localhost:{{ nginx_host_port }}/health"
app_hello_url: "http://localhost:{{ nginx_host_port }}/"
