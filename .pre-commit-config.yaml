repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy запускается из окружения проекта, а не через mirrors-mypy: тот ставит
  # mypy в изолированный virtualenv и не видит sqlalchemy, fastapi и pydantic,
  # пока их не продублируешь в additional_dependencies — второй список
  # зависимостей, который неизбежно разойдётся с pyproject.toml.
  #
  # pass_filenames: false — намеренно. Проверка типов на подмножестве файлов
  # даёт и ложные ошибки, и пропуски: mypy нужен весь пакет целиком.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'PY=.venv/Scripts/python; [ -x "$PY" ] || PY=.venv/bin/python; "$PY" -m mypy app tests'
        language: system
        types: [python]
        pass_filenames: false


